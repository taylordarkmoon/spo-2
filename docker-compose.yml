services:
  db:
    image: postgres:16-alpine
    container_name: shpora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shpora}
      POSTGRES_USER: ${POSTGRES_USER:-shpora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shpora}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # снаружи 5433, чтобы не конфликтовать с локальным Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shpora} -d ${POSTGRES_DB:-shpora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: shpora_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shpora}:${POSTGRES_PASSWORD:-shpora}@db:5432/${POSTGRES_DB:-shpora}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
