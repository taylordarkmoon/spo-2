services:
  frontend:
    image: ${IMAGE_PREFIX:?}-frontend:${IMAGE_TAG:-latest}
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik"
        - "traefik.http.routers.shpora.rule=Host(`${DOMAIN:?}`)"
        - "traefik.http.routers.shpora.entrypoints=websecure"
        - "traefik.http.routers.shpora.tls=true"
        - "traefik.http.routers.shpora.tls.certresolver=letsencrypt"
        - "traefik.http.services.shpora.loadbalancer.server.port=80"
    networks:
      - traefik
      - internal

  cheatsheet-backend:
    image: ${IMAGE_PREFIX:?}-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME}
      WARNINGS_TO_AUTO_BAN: ${WARNINGS_TO_AUTO_BAN}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA}
    volumes:
      - media:/app/media
    deploy:
      replicas: 1
    networks:
      - internal

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1
    networks:
      - internal

networks:
  traefik:
    external: true
  internal:

volumes:
  pgdata:
  media:
